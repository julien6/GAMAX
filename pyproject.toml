[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamax"
version = "0.4.0"
description = "Restricted automatic GAML to JAX compiler and differential validation pilot"
requires-python = ">=3.10"
dependencies = ["jax[cpu]==0.6.2", "websocket-client==1.9.0", "pillow==11.3.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
benchmark = ["pillow==11.3.0", "psutil==7.1.0"]

[project.scripts]
gamax = "gamax.cli:main"

[tool.setuptools.packages.find]
include = ["gamax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
